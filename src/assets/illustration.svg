<svg xmlns="http://www.w3.org/2000/svg" viewBox="60 200 490 480">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- back card -->
  <g transform="rotate(-8 300 470)">
    <rect x="130" y="290" width="330" height="360" rx="26" fill="#fff" fill-opacity=".25"/>
  </g>
  <!-- main card -->
  <rect x="150" y="270" width="320" height="380" rx="26" fill="url(#card)"/>
  <rect x="185" y="310" width="110" height="14" rx="7" fill="#4f46e5"/>
  <rect x="185" y="350" width="250" height="36" rx="10" fill="#c7d2fe"/>
  <rect x="185" y="402" width="250" height="36" rx="10" fill="#c7d2fe"/>
  <rect x="185" y="454" width="250" height="36" rx="10" fill="#c7d2fe"/>
  <rect x="185" y="520" width="120" height="40" rx="20" fill="#4f46e5"/>
  <rect x="320" y="520" width="115" height="40" rx="20" fill="#f472b6"/>
  <!-- progress dots -->
  <g fill="#c7d2fe"><circle cx="230" cy="600" r="7"/><circle cx="260" cy="600" r="7"/><circle cx="290" cy="600" r="7"/></g>
  <circle cx="200" cy="600" r="7" fill="#4f46e5"/>
  <!-- check badge -->
  <circle cx="450" cy="270" r="48" fill="#22c55e"/>
  <path d="M428 270 l16 16 l30 -34" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- sparkles -->
  <g fill="#fff" fill-opacity=".8">
    <path d="M90 230 l8 22 l22 8 l-22 8 l-8 22 l-8 -22 l-22 -8 l22 -8z"/>
    <path d="M520 560 l5 14 l14 5 l-14 5 l-5 14 l-5 -14 l-14 -5 l14 -5z"/>
  </g>
</svg>
